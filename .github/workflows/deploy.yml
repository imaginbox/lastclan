name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot (4.7.1 + export templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      # CACHE D'IMPORT : le projet pèse ~200 Mo d'assets. Le cache est clé par
      # les fichiers de RESSOURCES SEULEMENT (pas les .gd, qui changent souvent) :
      # si un push ne modifie que des scripts, on réutilise l'import déjà fait et
      # on ne retraite pas 200 Mo -> build beaucoup plus rapide. On inclut aussi
      # la version de Godot (via project.godot config_version) par prudence.
      - name: Cache Godot import (.godot)
        uses: actions/cache@v4
        with:
          path: |
            .godot/
            ~/.local/share/godot/
          key: godot-import-${{ runner.os }}-${{ hashFiles('project.godot', 'export_presets.cfg', 'assets/**', 'scenes/**', 'shaders/**', 'addons/**') }}
          restore-keys: |
            godot-import-${{ runner.os }}-

      # Importe les ressources (crée le cache .godot indispensable à l'export).
      - name: Import Godot resources
        run: |
          godot --headless --path "$GITHUB_WORKSPACE" --import --quit || true

      - name: Export Web
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/web"
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
