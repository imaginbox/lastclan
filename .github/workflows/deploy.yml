name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot (4.7.1)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false

      # Télécharge et installe les templates d'export (nécessaires à l'export Web).
      - name: Install Godot export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz" -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          cd ~/.local/share/godot/export_templates
          unzip -o -q "$OLDPWD/templates.tpz"
          mv templates/4.7.1.stable . 2>/dev/null || mv "4.7.1.stable" . 2>/dev/null || true
          ls -la ~/.local/share/godot/export_templates/

      # Importe les ressources (crée le cache .godot indispensable à l'export).
      - name: Import Godot resources
        run: |
          godot --headless --path "$GITHUB_WORKSPACE" --import --quit || true

      - name: Export Web
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/web"
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
